name: ساخت APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: دریافت کد
      uses: actions/checkout@v4

    - name: تنظیم پایتون
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: نصب وابستگی‌ها
      run: |
        python -m pip install --upgrade pip
        pip install flet==0.28.3
        pip install persian-datepicker
        # نصب از requirements.txt
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        # نمایش لیست پکیج‌ها برای تأیید
        pip list

    - name: تنظیم Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: تنظیم Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: نصب Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        curl -L -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools.zip
        rm commandlinetools.zip
        mv cmdline-tools latest
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

    - name: پذیرش مجوزها
      run: |
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: نصب پلتفرم‌ها
      run: |
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: ساخت APK
      env:
        FLET_FORCE_FLUTTER_INSTALL: 1
      run: |
        flutter config --no-analytics
        cd src
        # اطمینان از نصب Flet در محیط ساخت
        pip install flet==0.28.3
        yes | flet build apk --verbose

    - name: ذخیره APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: src/build/apk/
        if-no-files-found: error
